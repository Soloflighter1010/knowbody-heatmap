name: Export Heatmap

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Export data store to CSV
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
        run: |
          python3 - <<'EOF'
          import urllib.request
          import urllib.parse
          import json
          import os

          token = os.environ['MAKE_API_TOKEN']
          base  = 'https://us2.make.com/api/v2/data-store-data'
          params = urllib.parse.urlencode({'dataStoreId': 92220, 'pg[limit]': 100})
          url   = f'{base}?{params}'

          req = urllib.request.Request(url, headers={
              'Authorization': f'Token {token}',
              'Content-Type':  'application/json',
          })

          with urllib.request.urlopen(req) as resp:
              raw = json.loads(resp.read())

          print('API response keys:', list(raw.keys()) if isinstance(raw, dict) else 'array')

          # Make wraps results — try both shapes
          if isinstance(raw, list):
              items = raw
          else:
              items = (
                  raw.get('dataStoreData') or
                  raw.get('records')       or
                  raw.get('data')          or
                  []
              )

          lines = []
          for item in items:
              key  = item.get('key', '')
              data = item.get('data', {}) or {}
              if not key or not (key.startswith('dayuser:') or key.startswith('user:')):
                  continue
              count      = data.get('count',     0)  or 0
              first_post = data.get('firstPost', '') or ''
              lines.append(f'{key},{count},{first_post}')

          with open('heatmap.csv', 'w') as f:
              f.write('\n'.join(lines))

          print(f'Written {len(lines)} records to heatmap.csv')
          if lines:
              print('Sample:', lines[0])
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name  'heatmap-bot'
          git config user.email 'bot@knowbody.online'
          git add heatmap.csv
          git diff --staged --quiet \
            || (git commit -m "heatmap: $(date -u +'%Y-%m-%dT%H:%M')Z" && git push)
